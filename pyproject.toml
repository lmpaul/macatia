[project]
name = "ralph-kit"
dynamic = ["version"]
description = "Run coding agents through a parent GitHub issue, one sub-issue at a time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["questionary>=2.1,<3", "rich>=13,<16"]

[project.scripts]
ralph-kit = "ralph_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ralph_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ralph_kit"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "B", "UP", "SIM", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true
