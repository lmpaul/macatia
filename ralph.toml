# Ralph configuration for this repository. See https://github.com/lmpaul/ralph-kit
version = 1
repository = "lmpaul/ralph-kit"
base_branch = "main"
remote = "origin"
trusted_authors = ["lmpaul"]

[labels]
needs_triage = "needs-triage"
needs_info = "needs-info"
ready_for_agent = "ready-for-agent"
ready_for_human = "ready-for-human"
wontfix = "wontfix"
human_review = "human-review"
implemented = "implemented"

[models.implementation]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "medium"

# Only used by `ralph-kit run --review`.
[models.review]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "high"

[models.correction]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "medium"

[verification]
# Both checks need the quality module and manifest below; disabled checks do not load them.
local_checks = false
ci_checks = false
quality_module = ".github/scripts/quality.py"
quality_manifest = ".github/quality-gates.json"
