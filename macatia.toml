# Macatia configuration for this repository. See https://github.com/lmpaul/macatia
version = 1
repository = "lmpaul/macatia"
base_branch = "main"
remote = "origin"
trusted_authors = ["lmpaul"]
# true makes every run a reviewed run; macatia run --no-review overrides it.
review_by_default = false
# true makes every run hold a sleep lock; macatia run --no-caffeinate overrides it.
caffeinate_by_default = false

[labels]
needs_triage = "needs-triage"
needs_info = "needs-info"
ready_for_agent = "ready-for-agent"
ready_for_human = "ready-for-human"
wontfix = "wontfix"
agent_working = "agent-working"
human_review = "human-review"
implemented = "implemented"
work_started = "work-started"
standalone = "standalone"

[models.implementation]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "medium"

# Used by reviewed runs: macatia run --review, or every run when review_by_default = true.
[models.review]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "high"

[models.correction]
engine = "claude"
name = "opus"
display_name = "opus"
reasoning_effort = "medium"

# Takes over every session for the rest of a run after an engine failure.
[models.backup]
engine = "codex"
name = "gpt-6.1-sol"
display_name = "gpt-6.1-sol"
reasoning_effort = "medium"

[verification]
# Both checks need the quality module and manifest below; disabled checks do not load them.
local_checks = false
ci_checks = false
quality_module = ".github/scripts/quality.py"
quality_manifest = ".github/quality-gates.json"
# With ci_checks = false, true checks CI once on the run's final head, before the PR is marked ready;
# ci_checks = true already checks CI after each child, so this setting then has no effect.
final_ci_check = false

[child_session_limit]
# The most agent sessions one child may receive in a run. The correction limit (three corrections)
# bounds a child at 4 sessions in a standard run and 8 in a reviewed run, so higher values have no effect.
standard = 5
reviewed = 9
