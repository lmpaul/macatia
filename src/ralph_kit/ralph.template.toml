# Ralph configuration for this repository. See https://github.com/lmpaul/ralph-kit
version = 1
repository = "VOTRE_ORG/VOTRE_REPO"  # exact `gh repo view` owner/name
base_branch = "main"                  # Ralph never commits to this branch
remote = "origin"
trusted_authors = ["VOTRE_COMPTE_GITHUB"]  # include the account the loop runs as

[labels]
needs_triage = "needs-triage"
needs_info = "needs-info"
ready_for_agent = "ready-for-agent"
ready_for_human = "ready-for-human"
wontfix = "wontfix"
human_review = "human-review"
implemented = "implemented"

[models.implementation]
engine = "claude"  # "codex" or "claude"
name = "MODELE_IMPLEMENTATION"
display_name = "Implementation"
reasoning_effort = "medium"

# Only used by `ralph-kit run --review`.
[models.review]
engine = "claude"
name = "MODELE_REVIEW"
display_name = "Review"
reasoning_effort = "high"

[models.correction]
engine = "claude"
name = "MODELE_CORRECTION"
display_name = "Correction"
reasoning_effort = "medium"

[verification]
# Both checks need the quality module and manifest below. Disabled checks are not loaded.
local_checks = false
ci_checks = false
quality_module = ".github/scripts/quality.py"
quality_manifest = ".github/quality-gates.json"
