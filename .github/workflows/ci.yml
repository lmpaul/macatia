name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Git identity for fixture repositories
        run: |
          git config --global user.name "macatia CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Lint
        run: pipx run ruff==0.17.1 check src tests
      - name: Install macatia and its dependencies
        run: pip install .
      - name: Tests
        run: python -m unittest discover -s tests
      - name: CLI smoke test
        run: macatia --version
